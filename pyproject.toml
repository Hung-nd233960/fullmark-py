[project]
name = "fullmark-py"
version = "0.10.3"
description = "The frozen fullmark 0.10.x line (Python), kept as the survey server for document-kit and presentation-kit. Quizzes moved to fullmark 1.0: https://github.com/Hung-nd233960/fullmark"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hung-nd233960" }]
keywords = ["quiz", "markdown", "education", "self-grading", "offline", "html"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
requires-python = ">=3.13"
dependencies = [
  "markdown-it-py>=3",
  "mdit-py-plugins>=0.4",
  "pyyaml>=6",
  "pydantic>=2",
  "jinja2>=3",
  "pygments>=2.17",
  "tomli-w>=1.0",
  "rich>=13",
]

[project.scripts]
fullmark-py = "fullmark.cli:main"

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.45", "matplotlib>=3.8", "jsonschema>=4.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fullmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: builds and installs a wheel; needs uv and the network"]

[tool.ruff.format]
line-ending = "lf"

[project.urls]
Homepage = "https://github.com/Hung-nd233960/fullmark"
Repository = "https://github.com/Hung-nd233960/fullmark"
Issues = "https://github.com/Hung-nd233960/fullmark/issues"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/skill",
  "/README.md",
  "/LICENSE",
  "/AGENTS.md",
  "/.markdownlint-cli2.jsonc",
  "/pyproject.toml",
]
exclude = ["/docs/plans", "/docs/qc", "/docs/screenshots"]
